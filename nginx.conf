server {
    listen 443 ssl;
    server_name localhost;

    # Certyfikaty SSL zamontowane w kontenerze Nginxa
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Frontend React (Pliki statyczne)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy do Parse Server API
    location /parse/ {
        proxy_pass http://innowacje-parse:1337/parse/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3. Proxy do Parse Dashboard
    location /dashboard/ {
        proxy_pass http://innowacje-parse:1337/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 4. Obsługa WebSockets dla Parse LiveQuery (jeśli używasz)
    location /parse/events {
        proxy_pass http://innowacje-parse:1337/parse/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}

# Opcjonalne przekierowanie HTTP -> HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}