version: '3.8'

services:
  # 1. Baza danych MongoDB
  mongo:
    image: mongo:6.0
    container_name: innowacje-mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: innowacje_db
    volumes:
      - mongo_data:/data/db
    networks:
      - innowacje-network

  # 2. Parse Server + Cloud Code + Parse Dashboard
  parse-app:
    build:
      context: .
      target: parse-server
    container_name: innowacje-parse
    restart: always
    depends_on:
      - mongo
    environment:
      PARSE_SERVER_DATABASE_URI: mongodb://mongo:27017/innowacje_db
      PARSE_SERVER_APPLICATION_ID: ${APP_ID:-innowacje2026}
      PARSE_SERVER_MASTER_KEY: ${MASTER_KEY:-fa114fa1-1ddc-49f1-8034-a8ab414fa558}
      PARSE_SERVER_APP_NAME: ${APP_NAME:-Innowacje 2026}
      PARSE_SERVER_URL: http://innowacje-parse:1337/parse
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:-http://localhost:1337/parse}
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASS: ${DASHBOARD_PASS:-pass}
    ports:
      - "1337:1337"
    networks:
      - innowacje-network

  # 3. Frontend (Nginx + React + Proxy SSL)
  frontend:
    profiles: ["prod"]
    build:
      context: .
      target: frontend-nginx
    container_name: innowacje-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/key.pem:/etc/nginx/certs/key.pem:ro
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - parse-app
    networks:
      - innowacje-network

networks:
  innowacje-network:
    driver: bridge

volumes:
  mongo_data: